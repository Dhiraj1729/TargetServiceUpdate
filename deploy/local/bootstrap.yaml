apiVersion: v1
kind: Namespace
metadata:
  name: hsm-system
  labels:
    app.kubernetes.io/part-of: service-target-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-target-manager
  namespace: hsm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-target-manager
  namespace: hsm-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-target-manager
  namespace: hsm-system
subjects:
  - kind: ServiceAccount
    name: service-target-manager
    namespace: hsm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-target-manager
