apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-target-manager
  namespace: hsm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-target-manager
  template:
    metadata:
      labels:
        app: service-target-manager
    spec:
      serviceAccountName: service-target-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: service-target-manager:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HSM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-target-manager
  namespace: hsm-system
spec:
  selector:
    app: service-target-manager
  ports:
    - name: http
      port: 8080
      targetPort: http
